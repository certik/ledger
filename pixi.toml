[workspace]
authors = ["Ondřej Čertík <ondrej@certik.us>"]
channels = ["conda-forge"]
description = "Add a short description here"
name = "ledger"
platforms = ["win-64", "osx-arm64"]
version = "3.3.2"
preview = ["pixi-build"]

[dependencies]
ledger = { path = "." }

[package]
name = "ledger"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.3.*" }

[package.build.config]
extra-args = ["-DBoost_USE_STATIC_LIBS=OFF", "-DBUILD_LIBRARY=off"]

[package.host-dependencies]
boost = "1.72.*"
gmp = ">=6.3.0,<7"
mpfr = ">=4.2.1,<5"

[package.run-dependencies]
boost = "1.72.*"
